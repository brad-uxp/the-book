plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bolstro.book.appupdate'
version = '0.1.0'

android {
  namespace "com.bolstro.book.appupdate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // FileProvider: hands the downloaded APK to the system installer.
  implementation "androidx.core:core:1.13.1"
}
