services:
  postgres:
    image: postgres:16-alpine
    container_name: thebook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thebook
      POSTGRES_PASSWORD: thebook
      POSTGRES_DB: thebook
    ports:
      - "5434:5432"
    volumes:
      - thebook_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thebook -d thebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: thebook-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thebook
      MINIO_ROOT_PASSWORD: thebook123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - thebook_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: thebook-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 thebook thebook123) do
        echo 'waiting for minio...' && sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/thebook-invoices;
      /usr/bin/mc anonymous set none local/thebook-invoices;
      echo 'minio bucket ready';
      exit 0;
      "

volumes:
  thebook_pg_data:
  thebook_minio_data:
